<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <radialGradient id="lumiJoyBody" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#a8c7ff"/>
      <stop offset="45%"  stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#4a72c4"/>
    </radialGradient>
    <radialGradient id="lumiJoyEar" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#9ab8ff"/>
      <stop offset="100%" stop-color="#6288e0"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="110" cy="196" rx="52" ry="9" fill="rgba(122,162,247,0.18)"/>

  <!-- Ears -->
  <circle cx="60"  cy="60" r="28" fill="url(#lumiJoyEar)"/>
  <circle cx="160" cy="60" r="28" fill="url(#lumiJoyEar)"/>

  <!-- Main body -->
  <circle cx="110" cy="110" r="80" fill="url(#lumiJoyBody)"/>

  <!-- Body shine -->
  <ellipse cx="86" cy="70" rx="22" ry="14" fill="rgba(255,255,255,0.13)" transform="rotate(-25 86 70)"/>

  <!-- Joy: blush -->
  <ellipse cx="80"  cy="128" rx="14" ry="8" fill="#ffb7b7" opacity="0.55"/>
  <ellipse cx="140" cy="128" rx="14" ry="8" fill="#ffb7b7" opacity="0.55"/>

  <!-- Joy: crescent eyes (^ shape) -->
  <path d="M 78 106 Q 85 98 92 106" stroke="#1c2238" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 128 106 Q 135 98 142 106" stroke="#1c2238" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Joy: smile -->
  <path d="M 88 144 Q 110 178 132 144" stroke="#1c2238" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
