<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <radialGradient id="lumiBody" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#a8c7ff"/>
      <stop offset="45%"  stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#4a72c4"/>
    </radialGradient>
    <radialGradient id="lumiEar" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#9ab8ff"/>
      <stop offset="100%" stop-color="#6288e0"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="110" cy="196" rx="52" ry="9" fill="rgba(122,162,247,0.18)"/>

  <!-- Ears -->
  <circle cx="60"  cy="60" r="28" fill="url(#lumiEar)"/>
  <circle cx="160" cy="60" r="28" fill="url(#lumiEar)"/>

  <!-- Main body -->
  <circle cx="110" cy="110" r="80" fill="url(#lumiBody)"/>

  <!-- Body shine -->
  <ellipse cx="86" cy="70" rx="22" ry="14" fill="rgba(255,255,255,0.13)" transform="rotate(-25 86 70)"/>

  <!-- Eyes -->
  <circle cx="85"  cy="105" r="7" fill="#1c2238"/>
  <circle cx="135" cy="105" r="7" fill="#1c2238"/>

  <!-- Eye highlights -->
  <circle cx="88"  cy="101" r="2.2" fill="white" opacity="0.75"/>
  <circle cx="138" cy="101" r="2.2" fill="white" opacity="0.75"/>

  <!-- Mouth (neutral slight smile) -->
  <path d="M 93 138 Q 110 148 127 138" stroke="#1c2238" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle blush -->
  <circle cx="73"  cy="122" r="11" fill="rgba(255,140,175,0.18)"/>
  <circle cx="147" cy="122" r="11" fill="rgba(255,140,175,0.18)"/>
</svg>
